<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="70%" stop-color="#00d4e6"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Purple outer ring glow -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.8"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <!-- Lens body -->
  <circle cx="64" cy="64" r="44" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- Inner ring details -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Cyan glow -->
  <circle cx="64" cy="64" r="28" fill="url(#glow)"/>
  <!-- Cyan iris -->
  <circle cx="64" cy="64" r="18" fill="url(#iris)" opacity="0.9"/>
  <!-- Pupil -->
  <circle cx="64" cy="64" r="8" fill="#080c14"/>
  <!-- Highlight -->
  <circle cx="58" cy="58" r="4" fill="white" opacity="0.3"/>
</svg>